spring:
  application:
    name: group-admin-system
  security:
    user:
      name: ${SPRING_SECURITY_USER_NAME:admin}
      password: ${SPRING_SECURITY_USER_PASSWORD:change-me}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/group_admin?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:group_admin}
    password: ${SPRING_DATASOURCE_PASSWORD:group_admin_password}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:com.mysql.cj.jdbc.Driver}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

server:
  port: ${BACKEND_PORT:8080}

app:
  jwt:
    # 生产环境必须显式配置 JWT_SECRET，禁止在主配置中保留可部署生效的默认密钥。
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}

---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:group_admin;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
app:
  jwt:
    # 仅 test profile 使用固定测试密钥，避免生产环境误用默认 JWT 密钥。
    secret: group-admin-system-test-jwt-secret-2026-32-bytes
